<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="symgov-build" content="2026-06-01.01" />
    <meta name="symgov-api-root" content="/api/v1" />
    <meta name="symgov-api-base-url" content="" />
    <!-- Idox design system: DM Sans (400, 500, 600, 700). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
      rel="stylesheet"
    />
    <!--
      The Idox system also specifies Font Awesome via the Idox Pro kit
      (kit.fontawesome.com). That kit is domain-restricted, so symgov keeps its
      existing inline SVG icons for now. See ui-design/idox-design-system.
    -->
    <title>symgov</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.SYMGOV_CONFIG = Object.freeze({
        build: document.querySelector('meta[name="symgov-build"]')?.content || '',
        apiRoot: document.querySelector('meta[name="symgov-api-root"]')?.content || '',
        apiBaseUrl: document.querySelector('meta[name="symgov-api-base-url"]')?.content || ''
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
